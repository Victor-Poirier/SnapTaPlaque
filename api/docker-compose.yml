# ==============================================================================
# Configuration Docker Compose — API SnapTaPlaque
# ==============================================================================
# Orchestre le déploiement multi-conteneurs de l'application de reconnaissance de
# plaques d'immatriculation SnapTaPlaque. Ce fichier définit deux services :
#
#   1. db  — Base de données PostgreSQL 15 pour la persistance des utilisateurs,
#            des prédictions et de l'historique des détections.
#   2. api — Application FastAPI exposant les endpoints de reconnaissance de
#            plaques basés sur YOLO + EasyOCR, servie par Uvicorn.
#
# Les services communiquent via un réseau bridge dédié (snaptaplaque-network) 
# et les données de la base de données sont stockées dans un volume Docker 
# nommé (postgres_data) afin de survivre aux redémarrages des conteneurs.
#
# Utilisation :
#   Démarrer la stack :
#     docker-compose up --build
#
#   Arrêter la stack (les données sont préservées) :
#     docker-compose down
#
#   Arrêter la stack ET supprimer toutes les données (efface le volume) :
#     docker-compose down -v
#
# Variables d'environnement :
#   SECRET_KEY — Clé de signature JWT. Utilise une valeur par défaut en dev si 
#                elle n'est pas définie. À surcharger via un fichier .env ou un 
#                export shell en production.
#
# Prérequis :
#   - Docker Engine ≥ 20.10
#   - Docker Compose ≥ 1.29 (ou Compose V2)
# ==============================================================================

# version: '3.8'

services:
  # ============================================================================
  # Base de données PostgreSQL
  # ============================================================================
  # Instance allégée de PostgreSQL 15 basée sur Alpine.
  # Stocke toutes les données métier : utilisateurs, prédictions, historique.
  #
  # Les informations d'identification et le nom de la base sont configurés via
  # des variables d'environnement et doivent correspondre à la DATABASE_URL 
  # transmise au service api.
  #
  # Un healthcheck garantit que l'API ne démarre pas avant que la base ne soit 
  # prête à accepter des connexions (voir depends_on → condition ci-dessous).
  # ============================================================================
  db:
    image: postgres:15-alpine
    container_name: snaptaplaque-db
    environment:
      # Nom du superutilisateur de la base de données
      POSTGRES_USER: plate_user
      # Mot de passe du superutilisateur (à changer en production)
      POSTGRES_PASSWORD: plate_password
      # Nom de la base de données par défaut créée au premier lancement
      POSTGRES_DB: snaptaplaque_db
    ports:
      # Expose PostgreSQL sur l'hôte pour un accès local (pgAdmin, psql, etc.)
      - "5432:5432"
    volumes:
      # Volume nommé — persiste les fichiers de DB même après un arrêt
      # Supprimé uniquement via `docker-compose down -v`.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready retourne 0 quand le serveur accepte les connexions
      test: ["CMD-SHELL", "pg_isready -U plate_user -d snaptaplaque_db"]
      interval: 10s    # Délai entre deux tentatives de vérification
      timeout: 5s      # Temps d'attente maximum pour une vérification
      retries: 5       # Essais consécutifs avant déclaration d'état "unhealthy"
    networks:
      - snaptaplaque-network

  # ============================================================================
  # Application FastAPI (API SnapTaPlaque)
  # ============================================================================
  # Construit l'image de l'API à partir du Dockerfile dans le dossier courant.
  # Fait tourner Uvicorn sur le port 8000 pour servir l'application FastAPI.
  #
  # Le service attend que le healthcheck de "db" passe au vert avant de démarrer,
  # ce qui s'assure que l'API puisse se connecter à la base dès son lancement.
  # ============================================================================
  api:
    command: bash -c "python init_bd.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    build:
      context: .             # Contexte de build basé sur le répertoire api/
      dockerfile: Dockerfile # Cible le Dockerfile de l'API
    container_name: snaptaplaque-api
    ports:
      # Expose l'API sur le port de l'hôte
      - "8000:8000"
    environment:
      # Chaîne de connexion SQLAlchemy — cible le service "db" via le réseau interne
      - DATABASE_URL=postgresql://plate_user:plate_password@db:5432/snaptaplaque_db
      # Clé secrète JWT — à surcharger en production via le .env
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      # Désactivation du mode debug (sinon requêtes SQLAlchemy verbeuses)
      - DEBUG=False
      # Bloque l'installation potentiellement inopportune via pip d'Ultralytics 
      - YOLO_AUTOINSTALL=False
    depends_on:
      db:
        # Attend que la base soit saine (healthcheck vert)
        condition: service_healthy
    volumes:
      # Persiste les modèles EasyOCR pour éviter un re-téléchargement à chaque lancement
      - easyocr-models:/root/.EasyOCR
    networks:
      - snaptaplaque-network
    # Redémarre automatiquement sauf suite à un arrêt manuel (ex: docker-compose stop)
    restart: unless-stopped

# ==============================================================================
# Volumes Nommés
# ==============================================================================
# postgres_data  — Persistance des fichiers de base de données PostgreSQL.
# easyocr-models — Persistance des fichiers de modèles OCR.
# ==============================================================================
volumes:
  postgres_data:
  easyocr-models:

# ==============================================================================
# Réseaux (Networks)
# ==============================================================================
# snaptaplaque-network — Réseau isolé de type bridge pour permettre à l'API et
#                        à la DB de communiquer via leurs noms de service (ex: db:5432).
# ==============================================================================
networks:
  snaptaplaque-network:
    driver: bridge
